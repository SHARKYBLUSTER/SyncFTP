<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }} - Ajouter un serveur</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }
        
        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
        }
        
        .section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }
        
        /* Menu de navigation */
        .nav-menu {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            justify-content: center;
        }
        
        .nav-btn {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
        }
        
        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group input[type="text"],
        .form-group input[type="password"],
        .form-group input[type="number"],
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .nav-menu {
                flex-direction: column;
                align-items: center;
            }
            
            .nav-btn {
                width: 80%;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 {{ app_name }}</h1>
            <p class="subtitle">Gérez et testez vos connexions FTP facilement</p>
        </header>
        
        <!-- Menu de navigation -->
        <div class="section">
            <div class="nav-menu">
                <a href="/" class="nav-btn">🏠 TABLEAU DE BORD</a>
                <a href="/add" class="nav-btn">➕ AJOUTER SERVEUR FTP</a>
                <a href="/list" class="nav-btn">📋 LISTE DES SERVEURS</a>
                <a href="/tasks" class="nav-btn">🔄 TACHES DE SYNC</a>
                <a href="/logs" class="nav-btn">📜 LOGS</a>
                <a href="/config" class="nav-btn">⚙️ CONFIGURATION</a>
            </div>
        </div>
        
        <!-- Section: Ajouter un serveur -->
        <div class="section">
            <h2 class="section-title">➕ Ajouter un serveur FTP</h2>
            <form id="addServerForm" action="/add_server" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Nom du serveur *</label>
                        <input type="text" id="name" name="name" required placeholder="Mon Serveur FTP">
                    </div>
                    <div class="form-group">
                        <label for="host">Hôte *</label>
                        <input type="text" id="host" name="host" required placeholder="ftp.example.com">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="port">Port</label>
                        <input type="number" id="port" name="port" value="21" min="1" max="65535">
                    </div>
                    <div class="form-group">
                        <label for="username">Utilisateur</label>
                        <input type="text" id="username" name="username" value="anonymous">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" name="password">
                    </div>
                    <div class="form-group">
                        <label for="timeout">Timeout (secondes)</label>
                        <input type="number" id="timeout" name="timeout" value="30" min="1">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="use_ssl" name="use_ssl" value="true">
                            <label for="use_ssl" style="display: inline; cursor: pointer;">Utiliser SSL (FTPS)</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="test_directory">Répertoire à tester</label>
                        <input type="text" id="test_directory" name="test_directory" placeholder="/chemin/vers/dossier">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="display: flex; gap: 10px; align-items: center;">
                        <button type="submit" class="btn">💾 ENREGISTRER FTP</button>
                        <a href="/list" class="btn btn-secondary">🔙 Retour à la liste</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
